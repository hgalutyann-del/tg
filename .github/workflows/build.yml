name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix filenames automatically
        run: |
          if [ -f "main. Py" ]; then mv "main. Py" main.py; fi
          if [ -f "Main.py" ]; then mv "Main.py" main.py; fi
          if [ -f "mine. ru" ]; then mv "mine. ru" main.py; fi
          if [ -f "buijdozer. spec" ]; then mv "buijdozer. spec" buildozer.spec; fi
          if [ -f "buildozer. spec" ]; then mv "buildozer. spec" buildozer.spec; fi
          ls -la

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Buildozer directory
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake \
            libltdl-dev patch ccache lib32z1 lib32stdc++6

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip "setuptools<69.0.0" wheel
          pip install "cython==0.29.36" buildozer

      - name: Build APK with Buildozer
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          yes | buildozer android debug || buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-iOS-Mod-APK
          path: bin/*.apk
 
